    <script type="importmap">
        {

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { OutlinePass } from 'three/addons/postprocessing/OutlinePass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
        import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';

        const messageBox = document.getElementById('message-box');
        const bgMusic = document.getElementById('bg-music');
        const playPauseButton = document.getElementById('play-pause-btn');
        const roomTrack = {
            name: '14. End',
            src: '../music/kouyaoiku.mp3'
        };
        const sfxSources = {
            walking: 'sfx/walking.mp3',
            interact: 'sfx/interact.mp3',
            unlocking: 'sfx/unlocking.mp3',
            spinning: 'sfx/spinning.mp3',
            button: 'sfx/button.mp3',
            door: 'sfx/door.mp3',
            metalDoorOpen: 'sfx/metaldooropen.mp3',
            metalDoorClose: 'sfx/metaldoorclose.mp3',
            boxOpen: 'sfx/boxopen.mp3',
            correct: 'sfx/correct.mp3',
            wrong: 'sfx/wrong.mp3',
            safeopen: 'sfx/safeopen.mp3',
            keypickup: 'sfx/keypickup.mp3',
            complete: 'sfx/flag.mp3',
            chalk: 'sfx/chalk.mp3',
            erase: 'sfx/erase.mp3'
        };
        const sfxVolumes = {
            walking: 0.25,
            interact: 0.7,
            unlocking: 0.8,
            spinning: 0.45,
            button: 0.55,
            door: 0.7,
            metalDoorOpen: 0.7,
            metalDoorClose: 0.7,
            boxOpen: 0.7
        };
        const sfxPlaybackRates = {
            door: 2.0,
            metalDoorOpen: 2.0,
            metalDoorClose: 2.0
        };
        const combinationLockUnlockSoundDelay = 500;
        const sfxPools = {};
        let resumeMusicAfterPageReturn = false;
        let hasStartedGame = false;
        let sfxReadyPromise;

        sfxReadyPromise = Promise.all(Object.entries(sfxSources).map(([name, source]) => {
            const audio = new Audio(source);
            audio.preload = 'auto';
            audio.volume = sfxVolumes[name] || 0.5;
            audio.playbackRate = sfxPlaybackRates[name] || 1;
            sfxPools[name] = [audio];

            return new Promise((resolve) => {
                const settle = () => resolve();
                audio.addEventListener('canplaythrough', settle, { once: true });
                audio.addEventListener('error', settle, { once: true });
                audio.load();
            });
        }));

        sfxReadyPromise.catch(() => {
            console.warn('Some sound effects could not be preloaded.');
        });

        function playRoomMusic() {
            bgMusic.src = roomTrack.src;
            bgMusic.volume = 0.2;
            bgMusic.play().then(() => {
                playPauseButton.textContent = '❚❚';
            }).catch(() => {
                playPauseButton.textContent = '▶';
            });
        }

        function toggleRoomMusic() {
            if (bgMusic.paused) {
                playRoomMusic();
            } else {
                bgMusic.pause();
                playPauseButton.textContent = '▶';
            }
        }

        function pauseMusicForInactivePage() {
            if (bgMusic.paused) return;
            resumeMusicAfterPageReturn = true;
            bgMusic.pause();
            playPauseButton.textContent = '▶';
        }

        function resumeMusicAfterPageReturnIfNeeded() {
            if (!resumeMusicAfterPageReturn || document.hidden) return;
            resumeMusicAfterPageReturn = false;
            playRoomMusic();
        }

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                pauseMusicForInactivePage();
            } else {
                resumeMusicAfterPageReturnIfNeeded();
            }
        });
        window.addEventListener('pagehide', pauseMusicForInactivePage);
        window.addEventListener('pageshow', resumeMusicAfterPageReturnIfNeeded);

        function playSfx(name) {
            const pool = sfxPools[name];
            if (!pool) return;

            const audio = pool.find((candidate) => candidate.paused || candidate.ended) || pool[0];
            audio.currentTime = 0;
            audio.play().catch(() => {});
        }

        playPauseButton.addEventListener('click', (event) => {
            event.stopPropagation();
            toggleRoomMusic();
        });

        let messageFadeTimeout;
        const messageObserver = new MutationObserver(() => {
            messageBox.style.opacity = '1';
            clearTimeout(messageFadeTimeout);
            messageFadeTimeout = setTimeout(() => {
                messageBox.style.opacity = '0';
            }, 3000);
        });
        messageObserver.observe(messageBox, { childList: true, characterData: true, subtree: true });
        messageFadeTimeout = setTimeout(() => {
            messageBox.style.opacity = '0';
        }, 3000);

        // 1. Create the Loading Manager first
const loadingManager = new THREE.LoadingManager();

const loaderContainer = document.getElementById('loader-container');
const progressBar = document.getElementById('progress-bar');
const progressText = document.getElementById('progress-text');
let assetsReady = false;
let startBackgroundCryptexLoad = null;
let cryptexLoadStarted = false;
let cryptexLoadFailed = false;
let startDeferredObjectLoads = null;

let displayedPercentage = 0;

loadingManager.onProgress = function (url, itemsLoaded, itemsTotal) {
    // Calculate raw percentage
    let rawPercentage = Math.round((itemsLoaded / itemsTotal) * 100);
    
    // SAFETY CHECK: Never let the percentage go backward. 
    // It can only stay equal or increase.
    if (rawPercentage > displayedPercentage) {
        displayedPercentage = rawPercentage;
    }

    // Update the UI
    progressBar.style.width = displayedPercentage + '%';
    progressText.innerText = displayedPercentage + '%';
};

loadingManager.onLoad = function () {
    assetsReady = true;
    if (startBackgroundCryptexLoad && !cryptexLoadStarted) startBackgroundCryptexLoad();
    if (startDeferredObjectLoads) startDeferredObjectLoads();
    // Force it to hit 100% cleanly at the end
    displayedPercentage = 100;
    progressBar.style.width = '100%';
    progressText.innerText = '100%';

    loaderContainer.style.opacity = '0';
    setTimeout(() => {
        loaderContainer.style.display = 'none';
    }, 500);
};

loadingManager.onError = function (url) {
    console.error('Error loading: ' + url);
};

// 2. Initialize Loaders with the LoadingManager passed in

// Virtual Joystick Logic for Movement
const joystickZone = document.getElementById('virtual-joystick-zone');
const joystickThumb = document.getElementById('virtual-joystick-thumb');
let touchId = null;

joystickZone.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (touchId === null) {
        touchId = e.changedTouches[0].identifier;
    }
});

joystickZone.addEventListener('touchmove', (e) => {
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === touchId) {
            let touch = e.changedTouches[i];
            let rect = joystickZone.getBoundingClientRect();
            let centerX = rect.left + rect.width / 2;
            let centerY = rect.top + rect.height / 2;
            
            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;
            let distance = Math.sqrt(dx * dx + dy * dy);
            let maxRadius = 35;

            if (distance > maxRadius) {
                dx *= maxRadius / distance;
                dy *= maxRadius / distance;
            }

            joystickThumb.style.transform = `translate(${dx}px, ${dy}px)`;

            // Map dx/dy to your movement flags
            moveForward = dy < -10;
            moveBackward = dy > 10;
            moveLeft = dx < -10;
            moveRight = dx > 10;
        }
    }
});

joystickZone.addEventListener('touchend', (e) => {
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === touchId) {
            touchId = null;
            joystickThumb.style.transform = `translate(0px, 0px)`;
            moveForward = false;
            moveBackward = false;
            moveLeft = false;
            moveRight = false;
        }
    }
});

function logPopupBackgroundEdge() {
    if (!popupModel || !camera) return;

    popupModel.updateMatrixWorld(true);
    const bounds = new THREE.Box3().setFromObject(popupModel);
    const corners = [
        new THREE.Vector3(bounds.min.x, bounds.min.y, bounds.min.z),
        new THREE.Vector3(bounds.min.x, bounds.min.y, bounds.max.z),
        new THREE.Vector3(bounds.min.x, bounds.max.y, bounds.min.z),
        new THREE.Vector3(bounds.min.x, bounds.max.y, bounds.max.z),
        new THREE.Vector3(bounds.max.x, bounds.min.y, bounds.min.z),
        new THREE.Vector3(bounds.max.x, bounds.min.y, bounds.max.z),
        new THREE.Vector3(bounds.max.x, bounds.max.y, bounds.min.z),
        new THREE.Vector3(bounds.max.x, bounds.max.y, bounds.max.z)
    ];
    const backgroundDirection = backgroundPlane
        ? backgroundPlane.position.clone().sub(camera.position).normalize()
        : camera.getWorldDirection(new THREE.Vector3());
    const backgroundTangent = new THREE.Vector3(1, 0, 0)
        .applyQuaternion(backgroundPlane?.quaternion || camera.quaternion)
        .normalize();
    const edgeDepth = Math.max(...corners.map((corner) =>
        corner.clone().sub(camera.position).dot(backgroundDirection)));
    const edgeCorners = corners.filter((corner) =>
        Math.abs(corner.clone().sub(camera.position).dot(backgroundDirection) - edgeDepth) < 0.0001
    );
    const edgeCenter = edgeCorners.reduce((sum, corner) => sum.add(corner), new THREE.Vector3())
        .multiplyScalar(1 / edgeCorners.length);
    const edgeHalfLength = Math.max(...edgeCorners.map((corner) =>
        Math.abs(corner.clone().sub(edgeCenter).dot(backgroundTangent))
    ));
    popupEdgeStart.copy(edgeCenter).addScaledVector(backgroundTangent, -edgeHalfLength);
    popupEdgeEnd.copy(edgeCenter).addScaledVector(backgroundTangent, edgeHalfLength);

    console.log('Nobita edge closest to background:', {
        start: { x: popupEdgeStart.x, y: popupEdgeStart.y, z: popupEdgeStart.z },
        end: { x: popupEdgeEnd.x, y: popupEdgeEnd.y, z: popupEdgeEnd.z },
        distanceFromPlayer: edgeCenter.distanceTo(camera.position)
    });
}

let mobileLastX = 0;
let mobileLastY = 0;
let mobileLookTouchId = null;
const mobileLookSensitivity = 0.0045;
const mobileLookRotation = new THREE.Euler(0, 0, 0, 'YXZ');
window.addEventListener('touchstart', (e) => {
    const touch = Array.from(e.changedTouches).find((item) => item.clientX > window.innerWidth / 2);
    const isMobileControl = e.target.closest && e.target.closest('#mobile-interact-btn, #mobile-crouch-btn, #mobile-performance-btn');
    if (touch && !isMobileControl && mobileLookTouchId === null) {
        mobileLookTouchId = touch.identifier;
        mobileLastX = touch.clientX;
        mobileLastY = touch.clientY;
    }
});

window.addEventListener('touchmove', (e) => {
    const touch = Array.from(e.changedTouches).find((item) => item.identifier === mobileLookTouchId);
    if (touch && controls.isLocked) {
        e.preventDefault();
        const deltaX = touch.clientX - mobileLastX;
        const deltaY = touch.clientY - mobileLastY;

        mobileLookRotation.setFromQuaternion(camera.quaternion);
        mobileLookRotation.y -= deltaX * mobileLookSensitivity * controls.pointerSpeed;
        mobileLookRotation.x -= deltaY * mobileLookSensitivity * controls.pointerSpeed;
        mobileLookRotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, mobileLookRotation.x));
        camera.quaternion.setFromEuler(mobileLookRotation);
        mobileLastX = touch.clientX;
        mobileLastY = touch.clientY;
    }
}, { passive: false });

window.addEventListener('touchend', (e) => {
    if (Array.from(e.changedTouches).some((touch) => touch.identifier === mobileLookTouchId)) {
        mobileLookTouchId = null;
    }
});

window.addEventListener('touchcancel', (e) => {
    if (Array.from(e.changedTouches).some((touch) => touch.identifier === mobileLookTouchId)) {
        mobileLookTouchId = null;
    }
});

    function createBackgroundPlane(texture) {
        if (backgroundPlaneCreated) return;
        backgroundPlaneCreated = true;

        // Increased segments to 96 for a super smooth curve
        const bgGeometry = new THREE.PlaneGeometry(14, 3.9, 96, 1);
        const bgPositions = bgGeometry.attributes.position;
        const bendRadius = 24;
        for (let i = 0; i < bgPositions.count; i++) {
            const localX = bgPositions.getX(i);
            bgPositions.setZ(i, (localX * localX) / (2 * bendRadius));
        }
        bgPositions.needsUpdate = true;
        bgGeometry.computeVertexNormals();

        const bgMaterial = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
        backgroundPlane = new THREE.Mesh(bgGeometry, bgMaterial);
        backgroundPlane.castShadow = false;
        backgroundPlane.receiveShadow = false;

async function triggerFullscreen() {
    if (document.fullscreenElement || document.webkitFullscreenElement) return true;

    const request = document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen;
    if (!request) {
        document.getElementById('message-box').innerText = 'Fullscreen is not supported by this browser.';
        console.warn('Fullscreen is not supported by this browser.');
        return false;
    }

    try {
        await Promise.resolve(request.call(document.documentElement));
        return true;
    } catch (err) {
        document.getElementById('message-box').innerText = 'Fullscreen was blocked by the browser.';
        console.warn(`Error attempting to enable fullscreen: ${err.message}`);
        return false;
    }
}

                        closeInspectMode();
                    }
                    return;
                }

                if (isZoomedToSafe) {
                    if (e.code === 'Escape' || e.code === 'KeyE') {
                        zoomOutFromSafe();
                    }
                    if (e.code === 'KeyC') {
                        if (cheatActivated) logAndCopySafeHitboxPosition();
                    }
                    return;
                }

                if (!isMobileDevice && /^[1-3]$/.test(e.key)) {
                    const isLookingAtPencilCase = highlightedObject?.userData?.name === 'Pencil Case';
                    const expectedSlot = String((pcCheatSlotIndex % 3) + 1);

                    if (!isCrouching || !isLookingAtPencilCase || e.key !== expectedSlot) {
                        resetPcCheatSequence();
                    } else {
                        pcCheatSlotIndex += 1;
                        clearTimeout(pcCheatSlotTimeout);
                        pcCheatSlotTimeout = setTimeout(resetPcCheatSequence, 3000);

                        if (pcCheatSlotIndex === 6) {
                            resetPcCheatSequence();
                            activateAllKeys();
                        }
                    }
                    return;
                }

                switch (e.code) {
                    case 'KeyW': case 'ArrowUp': moveForward = true; break;
                    case 'KeyS': case 'ArrowDown': moveBackward = true; break;
                    case 'KeyA': case 'ArrowLeft': moveLeft = true; break;
                    case 'KeyD': case 'ArrowRight': moveRight = true; break;
                    case 'ShiftLeft': case 'ShiftRight': 
                        isCrouching = !isCrouching; 
                        break;
                    case 'KeyH': if (cheatActivated) toggleHitboxes(); break;
                    case 'KeyC': if (cheatActivated) logCrosshairCoordinates(); break;
                    case 'KeyE':
                        if (controls.isLocked) {
                            triggerInteraction();
                        }
                        break;
                }
            });

            window.addEventListener('keyup', (e) => {
                switch (e.code) {
                    case 'KeyW': case 'ArrowUp': moveForward = false; break;
                    case 'KeyS': case 'ArrowDown': moveBackward = false; break;
                    case 'KeyA': case 'ArrowLeft': moveLeft = false; break;
                    case 'KeyD': case 'ArrowRight': moveRight = false; break;
                }

                
            });

            loadClassroomModel();

        function applyInitialLightingSetup() {
            scene.fog = new THREE.FogExp2(0x111111, 0.03);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.autoUpdate = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            if (!ambientLightRef) {
                ambientLightRef = new THREE.AmbientLight(0xddeeff, 0.6);
                scene.add(ambientLightRef);
            }
            ambientLightRef.visible = true;
            ambientLightRef.intensity = 0.6;

            if (!hemiLightRef) {
                hemiLightRef = new THREE.HemisphereLight(0xffffff, 0x444444, 0.8);
                scene.add(hemiLightRef);
            }
            hemiLightRef.position.set(0, 20, 0);
            hemiLightRef.visible = true;
            hemiLightRef.intensity = 0.8;

            if (!dirLightRef) {
                dirLightRef = new THREE.DirectionalLight(0xfffaed, 1.2);
                scene.add(dirLightRef);
            }
            dirLightRef.position.set(15, 3, 0);
            dirLightRef.visible = true;
            dirLightRef.intensity = 1.2;
            dirLightRef.castShadow = true;
            dirLightRef.shadow.mapSize.set(2048, 2048);
            dirLightRef.shadow.bias = -0.0002;
            dirLightRef.shadow.normalBias = 0.02;

            scene.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });

            dirLightRef.updateMatrixWorld(true);
            scene.updateMatrixWorld(true);
            renderer.shadowMap.needsUpdate = true;
            dirLightRef.shadow.needsUpdate = true;
        }

        function togglePerformanceMode() {
            isLowPerformanceMode = !isLowPerformanceMode;
            applyPerformanceModeSettings();

            const modeText = isLowPerformanceMode ? "Max Performance Mode Enabled" : "Standard Graphics Mode Enabled";
            document.getElementById('message-box').innerText = modeText;
        }

        function applyPerformanceModeSettings() {

            if (isLowPerformanceMode) {
                renderer.setPixelRatio(1);
                renderer.shadowMap.enabled = false;
                renderer.shadowMap.autoUpdate = false;
                ambientLightRef.intensity = 1.1;
                hemiLightRef.visible = false;
                dirLightRef.visible = false;
                dirLightRef.castShadow = false;
                scene.fog = null;
                smaaPass.enabled = false;
                setTextureQuality(false);
            } else {
                renderer.setPixelRatio(window.devicePixelRatio);
                renderer.shadowMap.enabled = true;
                renderer.shadowMap.autoUpdate = true;
                renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                ambientLightRef.intensity = 0.6;
                hemiLightRef.visible = true;
                dirLightRef.visible = true;
                dirLightRef.castShadow = true;
                renderer.shadowMap.needsUpdate = true;
                dirLightRef.shadow.needsUpdate = true;
                scene.fog = new THREE.FogExp2(0x111111, 0.03);
                smaaPass.enabled = true;
                setTextureQuality(true);
            }
        }

        function setTextureQuality(isHighQuality) {
            scene.traverse((child) => {
                if (!child.isMesh || !child.material) return;

                const materials = Array.isArray(child.material) ? child.material : [child.material];
                materials.forEach((material) => {
                    if (!material.map) return;
                    material.map.anisotropy = isHighQuality ? renderer.capabilities.getMaxAnisotropy() : 1;
                    material.map.needsUpdate = true;
                });
            });
        }

        function logCrosshairCoordinates() {
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(scene.children, true);
            const hit = intersects.find((intersection) => {
                const object = intersection.object;
                return !object.isLine && object.type !== 'Box3Helper';
            });

            if (hit) {
                const text = `X: ${hit.point.x.toFixed(3)}, Y: ${hit.point.y.toFixed(3)}, Z: ${hit.point.z.toFixed(3)}`;
                console.log(`--- Looked At Coordinate --- \n${text}`);
                
                navigator.clipboard.writeText(text).then(() => {
                    document.getElementById('message-box').innerText = `Copied to Clipboard: ${text}`;
                }).catch(err => {
                    console.error('Clipboard copy failed:', err);
                });
            }
        }

        function logAndCopySafeHitboxPosition() {
            const mouseVector = new THREE.Vector2(
                (lastMousePos.x / window.innerWidth) * 2 - 1,
                -(lastMousePos.y / window.innerHeight) * 2 + 1
            );

            raycaster.setFromCamera(mouseVector, camera);
            const intersects = raycaster.intersectObjects(safeModel.children, true);

            if (intersects.length > 0) {
                const hit = intersects[0];
                const localPoint = hit.point.clone();
                safeModel.worldToLocal(localPoint);

                const text = `btnMesh.position.set(${localPoint.x.toFixed(4)}, ${localPoint.y.toFixed(4)}, ${localPoint.z.toFixed(4)});`;
                console.log(`[SAFE MAPPING] Local Position: ${text}`);

                navigator.clipboard.writeText(text).then(() => {
                    document.getElementById('message-box').innerText = `Copied Safe Local Pos: ${text}`;
                }).catch(err => {
                    console.error('Clipboard copy failed:', err);
                });
            }
        }

       function loadMainSceneLock() {

        function zoomToSafeKeypad() {

            previousCameraRot.copy(camera.rotation);

            document.getElementById('ui-container').style.display = 'none';
            document.getElementById('crosshair').style.display = 'none';
            document.getElementById('interaction-prompt').style.display = 'none';
            document.getElementById('safe-code-display').style.display = 'block';

            gsap.to(camera.position, {
                x: 2.25, y: 0.65, z: 3.46,
                duration: 1.2,
                ease: "power2.inOut",

                onComplete: () => { document.getElementById('safe-exit-btn').style.display = 'block'; }

        function zoomOutFromSafe() {
            isZoomedToSafe = false;
            resetSafeCode();
            document.getElementById('safe-exit-btn').style.display = 'none';
            document.getElementById('safe-code-display').style.display = 'none';

            const currentLook = new THREE.Vector3(2.25, 0.65, 4.08); 
            const forwardVector = new THREE.Vector3(0, 0, -1).applyEuler(previousCameraRot);
            const targetLook = previousCameraPos.clone().add(forwardVector);

            gsap.to(camera.position, {
                x: previousCameraPos.x, y: previousCameraPos.y, z: previousCameraPos.z,
                duration: 1.2, ease: "power2.inOut"
            });

            gsap.to(currentLook, {
                x: targetLook.x, y: targetLook.y, z: targetLook.z,
                duration: 1.2,
                ease: "power2.inOut",
                onUpdate: () => camera.lookAt(currentLook),
                onComplete: () => {
                    camera.rotation.copy(previousCameraRot);
                    document.getElementById('ui-container').style.display = 'flex';
                    document.getElementById('crosshair').style.display = 'block';
                    if (!gameState.escaped) controls.lock();
                }
            });
        }

        function triggerSafeDigitInteraction(event) {
            const mouse = new THREE.Vector2(
                (event.clientX / window.innerWidth) * 2 - 1,
                -(event.clientY / window.innerHeight) * 2 + 1
            );
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(safeDigitInteractables, true);
            if (intersects.length > 0) {
                const hitObj = intersects[0].object;
                if (hitObj.userData && hitObj.userData.digit !== undefined) pressKey(hitObj.userData.digit);
            }
        }

        function checkLockSolution() {
            if (!inspectedModel || gameState.isSolved) return;
            let dials = [];
            inspectedModel.traverse((child) => { if (child.userData && child.userData.isDial) dials.push(child); });
            if (dials.length < 5) return;

            dials.sort((a, b) => {
                const posA = new THREE.Vector3(), posB = new THREE.Vector3();
                a.getWorldPosition(posA); b.getWorldPosition(posB);
                return posA.x - posB.x;
            });

            const requiredSteps = [2, 3, 6, 0, 3];
            let solved = true;
            for (let i = 0; i < dials.length && i < requiredSteps.length; i++) {
                if ((((dials[i].userData.currentStep % 10) + 10) % 10) !== requiredSteps[i]) {
                    solved = false;
                    break;
                }
            }

            if (solved && !gameState.isSolved) {
                gameState.isSolved = true;
                isAnimatingUnlock = true;
                if (mainSceneLock) {
                    mainSceneLock.visible = false;
                    interactables = interactables.filter(obj => obj !== mainSceneLock);
                }

                scene.traverse((child) => {
                    const nameLower = child.name.toLowerCase();
if (child.isMesh && nameLower === 'lockerdoor') {
    let doorMesh = child;
    doorMesh.userData = {
        name: 'Locker Door',
        type: 'lockerDoor',
        isOpen: false,
        isAnimating: false,
        baseRotationZ: doorMesh.rotation.z,
        targetRotationZ: doorMesh.rotation.z,
        action: () => {
            if (!gameState.isSolved) {
                // If the combination lock is NOT solved, clicking the locker opens the combination lock inspection
                openInspectMode('lock');

        function checkCryptexSolution() {
            if (!inspectedCryptexModel || gameState.cryptexSolved) return;
            let dials = [];
            inspectedCryptexModel.traverse((child) => { if (child.userData && child.userData.isCryptexDial) dials.push(child); });
            if (dials.length === 0) return;

            dials.sort((a, b) => {
                const posA = new THREE.Vector3(), posB = new THREE.Vector3();
                a.getWorldPosition(posA); b.getWorldPosition(posB);
                return posA.x - posB.x;
            });

            const requiredSteps = gameState.cryptexCombination;
            let solved = true;
            for (let i = 0; i < dials.length && i < requiredSteps.length; i++) {
                if ((((dials[i].userData.currentStep % 10) + 10) % 10) !== requiredSteps[i]) {
                    solved = false;
                    break;
                }
            }

            if (solved && !gameState.cryptexSolved) {
                gameState.cryptexSolved = true;
                if (mainSceneCryptex) {
                    mainSceneCryptex.visible = false;
                    interactables = interactables.filter(obj => obj !== mainSceneCryptex);
                }

                dials.forEach(dial => {
                    dial.userData.isDragging = false;
                });

                if (boxClosedModel && boxOpenedModel) {
                    boxClosedModel.visible = false;   
                    boxOpenedModel.visible = true;    
                    playSfx('boxOpen');

                    interactables = interactables.filter(obj => obj !== boxClosedModel);
                    if (!interactables.includes(boxOpenedModel)) interactables.push(boxOpenedModel);
                }

                const animationDelay = 1000;

                document.getElementById('inspect-title').innerText = "Cryptex Unlocked!";
                cryptexAnimationComplete = false;
                clearTimeout(cryptexExitTimer);
                setTimeout(() => {
                    dials.forEach(dial => {
                        dial.userData.isLocked = true;
                        dial.userData.targetRotationZ = dial.rotation.z + (Math.PI * 2);
                    });
                }, animationDelay);
            }
        }

        function checkCollisionAt(pos) {
            const playerBox = new THREE.Box3(
                new THREE.Vector3(pos.x - playerRadius, pos.y - 1.2, pos.z - playerRadius),
                new THREE.Vector3(pos.x + playerRadius, pos.y + 0.5, pos.z + playerRadius)
            );
            if (exitDoorCollider && exitDoorModel && !exitDoorModel.userData.isOpen && playerBox.intersectsBox(exitDoorCollider)) {
                return true;
            }
            for (let box of colliders) {
                if (playerBox.intersectsBox(box)) return true;
            }
            return false;
        }

        function moveAlongAxis(axis, distance) {
            const maxCollisionStep = playerRadius * 0.5;
            const stepCount = Math.max(1, Math.ceil(Math.abs(distance) / maxCollisionStep));
            const step = distance / stepCount;

            for (let index = 0; index < stepCount; index++) {
                const nextPos = camera.position.clone();
                nextPos[axis] += step;
                if (checkCollisionAt(nextPos)) break;
                camera.position[axis] = nextPos[axis];
            }
        }

        function checkExitDoorCrossing() {
            if (!exitDoorModel || gameState.escaped || !exitDoorModel.userData.isOpen) return;

            const { crossingAxis, crossingCenter, entrySide } = exitDoorModel.userData;
            if (!crossingAxis || entrySide === null) return;

            const distanceFromDoor = camera.position[crossingAxis] - crossingCenter[crossingAxis];
            const hasCrossedDoor = distanceFromDoor * entrySide < -0.45;
            if (!hasCrossedDoor) return;

            gameState.escaped = true;
            if (controls.isLocked) controls.unlock();
            playSfx('complete');
            document.getElementById('message-box').innerText = 'You escaped the classroom!';

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = Math.min((time - prevTime) / 1000, 0.1);

            if (chestMixer) chestMixer.update(delta);
            if (miniChestMixer) miniChestMixer.update(delta); 
            if (safeMixer) safeMixer.update(delta);
            if (inspectNotebookMixer) inspectNotebookMixer.update(delta);

            for (let dial of lockDials) {
                if (dial.userData && dial.userData.targetRotationZ !== undefined) {
                    const diff = dial.userData.targetRotationZ - dial.rotation.z;
                    const speed = dial.userData.isLocked ? 0.08 : 0.25;

                    if (Math.abs(diff) < 0.001) {
                        dial.rotation.z = dial.userData.targetRotationZ;
                    } else {
                        dial.rotation.z += diff * speed;
                    }
                }
            }
            for (let dial of cryptexDials) {
                if (dial.userData && dial.userData.targetRotationZ !== undefined) {
                    const diff = dial.userData.targetRotationZ - dial.rotation.z;
                    const speed = dial.userData.isLocked ? 0.08 : 0.25;

                    if (Math.abs(diff) < 0.001) {
                        dial.rotation.z = dial.userData.targetRotationZ;
                    } else {
                        dial.rotation.z += diff * speed;
                    }
                }
            }

            if (gameState.cryptexSolved && currentInspectType === 'cryptex' && inspecting && !cryptexAnimationComplete) {
                if (cryptexDials.length > 0 && cryptexDials.every(dial => Math.abs(dial.userData.targetRotationZ - dial.rotation.z) < 0.001)) {
                    cryptexAnimationComplete = true;
                    const statusEl = document.getElementById('tv-status-overlay');
                    statusEl.innerText = "Something Opened!";
                    statusEl.style.fontSize = '30px';
                    statusEl.style.color = '#4CAF50';
                    statusEl.style.opacity = '1';
                    document.getElementById('message-box').innerText = "Something opened!";

                    cryptexExitTimer = setTimeout(() => {
                        statusEl.style.opacity = '0';
                        closeInspectMode();
                    }, 5000);
                }
            }

            if (inspectedModel) {
                dialNumberPairs.forEach(pair => {
                    let dialObj = inspectedModel.getObjectByName(pair.dial);
                    let numObj = inspectedModel.getObjectByName(pair.number);
                    if (dialObj && numObj) numObj.rotation.z = dialObj.rotation.z;
                });
            }

            if (inspecting) {
                if (inspectMixer) inspectMixer.update(delta);
                
                if (currentInspectType === 'cryptex' && inspectedCryptexModel) {
                    const guideEl = document.getElementById('cryptex-alignment-guide');
                    if (guideEl) {
                        guideEl.style.display = 'block';

                        const box = new THREE.Box3().setFromObject(inspectedCryptexModel);
                        const center = box.getCenter(new THREE.Vector3());
                        center.project(inspectCamera);

                        const p1 = new THREE.Vector3(box.min.x, box.min.y, box.min.z).project(inspectCamera);
                        const p2 = new THREE.Vector3(box.max.x, box.max.y, box.max.z).project(inspectCamera);
                        
                        const rawWidth = Math.abs((p2.x - p1.x) * window.innerWidth * 0.5);

                        const offsetX = rawWidth * -0.044;  
                        const offsetY = window.innerHeight * 0.02 + (isMobileDevice ? 5 : 0);

                        const x = (center.x * 0.5 + 0.5) * window.innerWidth + offsetX + (isMobileDevice ? 3 : 0);
                        const y = (-(center.y * 0.5) + 0.5) * window.innerHeight + offsetY;

                        guideEl.style.left = `${x}px`;
                        guideEl.style.top = `${y}px`;

                        const widthMultiplier = 0.525 * mobileInspectionScale * (6 / 7) * (5 / 6);
                        const stableHeightRef = window.innerHeight * 0.35; 
                        const heightMultiplier = 0.23 * mobileInspectionScale * (6 / 7) * (8 / 7);

                        guideEl.style.width = `${rawWidth * widthMultiplier + (isMobileDevice ? 10 : 0)}px`;
                        guideEl.style.height = `${stableHeightRef * heightMultiplier}px`;
                    }
                }
                inspectRenderer.render(inspectScene, inspectCamera);
                prevTime = time;
                return;
            }

            if (isAnimatingUnlock) {
                if (inspectMixer) inspectMixer.update(delta);
                inspectRenderer.render(inspectScene, inspectCamera);
                prevTime = time;
                return;
            }

            for (let obj of animatables) {
                if (obj.userData && obj.userData.isAnimating) {
                    const diff = obj.userData.targetRotationZ - obj.rotation.z;
                    obj.rotation.z += diff * delta * 6.0; 
                    if (Math.abs(diff) < 0.01) {
                        obj.rotation.z = obj.userData.targetRotationZ;
                        obj.userData.isAnimating = false;
                    }
                }
            }

            if (!isZoomedToSafe && controls.isLocked) {
                const currentSpeed = isCrouching ? 1.5 : 2.5;
                const targetHeight = isCrouching ? 1.1 : 1.6;
                
                camera.position.y += (targetHeight - camera.position.y) * delta * 10.0;

                const actualStep = currentSpeed * delta;
                const dirVector = new THREE.Vector3();
                camera.getWorldDirection(dirVector);
                dirVector.y = 0;
                dirVector.normalize();
                const sideVector = new THREE.Vector3(-dirVector.z, 0, dirVector.x);

                let moveX = 0, moveZ = 0;
                if (moveForward) { moveX += dirVector.x * actualStep; moveZ += dirVector.z * actualStep; }
                if (moveBackward) { moveX -= dirVector.x * actualStep; moveZ -= dirVector.z * actualStep; }
                if (moveRight) { moveX += sideVector.x * actualStep; moveZ += sideVector.z * actualStep; } 
                if (moveLeft) { moveX -= sideVector.x * actualStep; moveZ -= sideVector.z * actualStep; }

                if (moveX !== 0) moveAlongAxis('x', moveX);
                if (moveZ !== 0) moveAlongAxis('z', moveZ);

                if (moveX !== 0 || moveZ !== 0) {
                    footstepTimer -= delta;
                    if (footstepTimer <= 0) {
                        playSfx('walking');
                        footstepTimer = isCrouching ? 0.8 : 0.55;
                    }
                } else {
                    footstepTimer = 0;
                }

                checkExitDoorCrossing();

raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
                const raycastTargets = backgroundPlane && !interactables.includes(backgroundPlane)
                    ? [...interactables, backgroundPlane]
                    : interactables;
                const intersects = raycaster.intersectObjects(raycastTargets, true);
                const isLookingAtBackground = backgroundPlane && intersects[0]?.object === backgroundPlane;
                const prompt = document.getElementById('interaction-prompt');

                if (isLookingAtBackground) {
                    setHighlightedObject(backgroundPlane);
                    prompt.style.display = 'none';
                } else if (intersects.length > 0 && intersects[0].distance < 4) {
                    let checkObj = intersects[0].object;
                    while (checkObj && !checkObj.userData?.action) checkObj = checkObj.parent;
                    
                    // Check if the object is Doraemon and the combination lock is unsolved
                    const isDoraemonLocked = (checkObj && checkObj.userData?.type === 'doraemon' && !gameState.isSolved);

                    if (checkObj && checkObj.userData?.action && !isDoraemonLocked && !(checkObj.userData.type === 'safe' && gameState.safeOpened)) {
                        setHighlightedObject(checkObj);
                        prompt.style.display = 'none';
                    } else {
                        setHighlightedObject(null);
                        prompt.style.display = 'none';
                    }
                } else {
                    setHighlightedObject(null);
                    prompt.style.display = 'none';
                }
            }

            prevTime = time;
            composer.render();
            checkPopupTrigger();
        }

        function loadNotebookModel() {
            globalGltfLoader.load('notebook.glb', (gltf) => {
                const notebookModel = gltf.scene;
                
                // Position and scale it on your table/desk
                notebookModel.position.set(-2.9, 0.85, -1.4); // Adjust coordinates as needed
                notebookModel.scale.set(0.1, 0.1, 0.1);
                
                notebookModel.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = !isLowPerformanceMode;
                        child.receiveShadow = !isLowPerformanceMode;
                    }
                });

                const notebookMeshes = [];
                let notebookCoverTarget = null;
                notebookModel.traverse((child) => {
                    if (!child.isMesh) return;

                    notebookMeshes.push(child);
                    const meshName = child.name.toLowerCase();
                    if (!notebookCoverTarget && /(cover|front|outside)/i.test(meshName) && !/page/i.test(meshName)) {
                        notebookCoverTarget = child;
                    }
                });

                if (!notebookCoverTarget) {
                    let largestMeshSize = 0;
                    notebookMeshes.forEach((mesh) => {
                        const meshBounds = new THREE.Box3().setFromObject(mesh);
                        const meshSize = meshBounds.getSize(new THREE.Vector3());
                        const meshArea = meshSize.x * meshSize.y * meshSize.z;
                        if (meshArea > largestMeshSize) {
                            largestMeshSize = meshArea;
                            notebookCoverTarget = mesh;
                        }
                    });
                }

                // Make it interactive to open inspection mode
                notebookModel.userData = {
                    name: 'Notebook',
                    type: 'notebook',
                    highlightTarget: notebookCoverTarget,
                    action: () => {
                        openInspectMode('notebook');
                    }
                };

                interactables.push(notebookModel);
                scene.add(notebookModel);
            }, undefined, (err) => {
                console.warn('Could not load notebook.glb:', err);
            });

function checkPopupTrigger() {
    if (!popupModel || !camera || !backgroundPlane) return;

    const distance = camera.position.distanceTo(backgroundPlane.position);
    if (!hasPoppedUp && distance > 3.5) {
        stareTimer = 0;
        hasPoppedUp = false;
        popupModel.visible = false;
        popupAnimationProgress = 0;
        popupTargetLocked = false;
        return;
    }

    raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
    const intersects = raycaster.intersectObject(backgroundPlane, true);
    const isLookingAtBackground = (intersects.length > 0 && intersects[0].distance <= 3.5);
    const backgroundHit = intersects[0];

    if (hasPoppedUp) {
        let isLookingAtPopup = true;
        if (popupAnimationProgress >= 1) {
            camera.updateMatrixWorld(true);
            const cameraFrustum = new THREE.Frustum().setFromProjectionMatrix(
                new THREE.Matrix4().multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse)
            );
            const popupBounds = new THREE.Box3().setFromObject(popupModel);
            isLookingAtPopup = cameraFrustum.intersectsBox(popupBounds);
        }
        if (!isLookingAtPopup) {
            popupModel.visible = false;
            hasPoppedUp = false;
            stareTimer = 0;
            popupAnimationProgress = 0;
            popupEdgeLogged = false;
            popupTargetLocked = false;
            return;
        }
    } else {
        // 3. Stare Timer
        if (isLookingAtBackground || popupTargetLocked) {
            stareTimer += 0.016;

            if (!popupTargetLocked && stareTimer >= 4.0 && backgroundHit) {
                const crosshairRay = raycaster.ray.direction.clone().normalize();
                popupHitPoint.copy(backgroundHit.point)
                    .addScaledVector(crosshairRay, -0.45);
                popupHitPoint.y = Math.max(popupHitPoint.y, popupMinimumHeadY);
                popupTargetLocked = true;
            }

            if (stareTimer >= 5.0) {
                hasPoppedUp = true;
                popupModel.visible = true;
            
            }
        } else {
            stareTimer = 0;
            popupTargetLocked = false;
            
        }
    }

    // 4. Pop-up animation
    if (hasPoppedUp) {
        popupModel.visible = true;

        if (popupAnimationProgress < 1) {
            popupAnimationProgress += 0.08; 
        }

        const targetPosition = popupHitPoint.clone();
        targetPosition.y -= popupHeadOffsetY;
        const startPoint = targetPosition.clone();
        startPoint.y -= 1.0;
        popupModel.position.lerpVectors(startPoint, targetPosition, popupAnimationProgress);
        const facingDirection = camera.position.clone().sub(popupModel.position);
        facingDirection.y = 0;
        popupModel.rotation.y = Math.atan2(facingDirection.x, facingDirection.z) - Math.PI / 2;

        if (popupAnimationProgress >= 1 && !popupEdgeLogged) {
            logPopupBackgroundEdge();
            popupEdgeLogged = true;
        }
    }
}
